// Reset NUM 1-9
alias reset_binds "unbind scancode89; unbind scancode90; unbind scancode91; unbind scancode92; unbind scancode93; unbind scancode94; unbind scancode95; unbind scancode96; unbind scancode97"

// Restore map-selection binds
alias bind_map_guides "bind scancode89 load_ancient; bind scancode90 load_inferno; bind scancode91 load_dusttwo; bind scancode92 load_mirage; bind scancode93 load_anubis; bind scancode94 load_cache; bind scancode95 load_nuke; bind scancode98 reset_binds_bind_map_guides"

// Reset + restore
alias reset_binds_bind_map_guides "reset_binds; bind_map_guides; maps_info_console_all; say Reset back to start. Look at your console to choose a map."

alias guide echoln currently not implemented

// Chat aliases
alias w_jumpthrow "say This is a W + Jumpthrow."
alias shift_walk_jumpthrow "say This is a shift walk jumpthrow. (most of the time max. 1 step, it's just for the momentum)"
alias run_jumpthrow "say This is a run jumpthrow."
alias jumpthrow "say This is a normal jumpthrow."

alias run_throw "say Just run a bit and release."

alias left_click_throw "say This is a normal left click throw."

