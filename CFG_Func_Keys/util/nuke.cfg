alias nuke_T_1 "setpos -1351.18 -1043.63 -352.00; setang -44.00 -19.27 0.00; say This is your 1st smoke Outside Wall close to Main. Stand on yellow line and aim under lamp. -> This is a Jumpthrow."
alias nuke_T_2 "setpos -1351.18 -1043.63 -352.00; setang -30.47 -22.49 0.00; say This is your 2nd smoke Outside Wall close to Main. Stand on yellow line and top left corner of the railing. -> This is a Jumpthrow."
alias nuke_T_3 "setpos -1268.02 -1162.12 -415.96; setang -45.25 -24.86 0.00; say This is your 1st smoke Outside Wall close to Red. Stand far left behind the truck. Aim in the middle between the windows. -> This is a Jumpthrow."
alias nuke_T_4 "setpos -1268.02 -1162.12 -415.96; setang -32.15 -23.09 0.00; say This is your 2nd smoke Outside Wall close to Red. Stand far left behind the truck. Aim at the left knob in the white. -> This is a Jumpthrow."
alias nuke_T_5 "setpos  -915.72 -1142.96 -415.96; setang -16.34 -17.46 0.00; say This is your Garage smoke. Stand next to the chain link fence on the right. Aim where top of Silo and windows meet. -> This is a Jumpthrow."
alias nuke_T_6 "setpos   -891.96 -927.03 -415.96; setang -14.16 -11.26 0.00; say This is your Vent drop smoke. Get in the corner next to the chain link fence. Aim at the bottom of 2nd line right of the lamp. -> This is a Jumpthrow."
alias nuke_T_7 "setpos   -526.74 -1138.91 -91.94; setang    -0.30 0.90 0.00; say This is your Vent drop molly. Get in the corner next to the chain link fence. Once up the ladder aim middle of blue are. Run and release before crossing yellow ladder on the right. -> This is a run Jumpthrow."

alias nuke_T "reset_binds; bind scancode58 nuke_T_1; bind scancode59 nuke_T_2; bind scancode60 nuke_T_3; bind scancode61 nuke_T_4; bind scancode62 nuke_T_5; bind scancode63 nuke_T_6; bind scancode64 nuke_T_7; nuke_T_info_chat; nuke_T_info_console_all"

