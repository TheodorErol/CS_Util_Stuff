alias mirage_A_T_6 "setpos  854.41 -1036.06 -251.96; setang -36.84 -150.89 0.00; say Lamp flash. Hug the middle of the door to your right. Aim above the lamp. -> This is a left click throw."
alias mirage_A_T_7 "setpos     16.07 -2359.91 24.00; setang     9.62 73.93 0.00; say Under Molly from Palace. Works from almost all positions in the corner area. Aim at the corner of the ladder hole. -> This is a left click throw."
alias mirage_A_T_8 "setpos  163.98 -1418.05 -112.00; setang  -4.12 -120.65 0.00; say Under Molly from Tetris. Aim as left as you can on the default A. The more to the right you are towards tetris the better. Care they can sit on the box under. -> This is a run then left click throw."
alias mirage_A_T_9 "setpos  283.03 -1597.81 -175.96; setang -17.91 171.68 0.00; say Stairs Molly from Ramp. Get stuck at the wall in ramp. Aim where the middle of the wall above Sandwich. Pretty forgiving lineup. -> This is a left click throw."

